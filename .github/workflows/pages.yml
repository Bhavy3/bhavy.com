name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html og.png _site/
          cp -R assets _site/assets
          if [ -d cdn-cgi ]; then cp -R cdn-cgi _site/cdn-cgi; fi
          touch _site/.nojekyll
          # This is a project site at /bhavy.com/ until a custom domain is set.
          # Relative asset URLs work at both that path and a custom domain root.
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) \
            -exec sed -i 's|/assets/|./assets/|g; s|/og\.png|./og.png|g' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
