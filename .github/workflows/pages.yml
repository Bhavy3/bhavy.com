name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html og.png _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          # This is a project site at /bhavy.com/ until a custom domain is set.
          # Relative asset URLs work at both that path and a custom domain root.
          #
          # Do NOT append ?v=... cache-busting queries to the entry script or
          # stylesheet links: the app fails to mount (Vue throws
          # "Cannot read properties of null" during mount) when the entry
          # module URL carries a query string. Asset filenames are already
          # content-hashed, and Pages sends max-age=600, so it isn't needed.
          # (og:image and the canonical URL stay absolute in index.html, so no
          # rewrite for /og.png here.)
          find _site -type f \( -name '*.html' -o -name '*.js' \) \
            -exec sed -i \
              -e 's|/assets/|./assets/|g' \
              -e 's|return"/"+e|return"./"+e|g' {} +
          find _site/assets -type f -name '*.css' \
            -exec sed -i 's|/assets/|./|g' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
